version: '3.8'

services:
  otb-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: otb_production_node
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - NODE_ENV=production
    volumes:
      # Mount persistent data directory so edits & leads persist across container recreations
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
